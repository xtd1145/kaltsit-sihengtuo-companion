<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>桌宠设置</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #253034;
      background: #f5f6f8;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      min-width: 620px;
      margin: 0;
      background: #f5f6f8;
      letter-spacing: 0;
    }

    button, input { font: inherit; }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 108px;
      padding: 22px 34px 19px;
      border-bottom: 1px solid #dfe3e6;
      background: #fff;
    }

    .avatar {
      width: 72px;
      height: 72px;
      flex: 0 0 72px;
      object-fit: contain;
      filter: drop-shadow(0 2px 2px rgba(23, 37, 39, 0.12));
    }

    h1 {
      margin: 0 0 4px;
      font-size: 20px;
      line-height: 26px;
      font-weight: 650;
    }

    .subtitle {
      margin: 0;
      color: #687276;
      font-size: 13px;
      line-height: 18px;
    }

    main { padding: 8px 34px 26px; }

    section {
      padding: 18px 0 10px;
      border-bottom: 1px solid #dfe3e6;
    }

    section:last-child { border-bottom: 0; }

    h2 {
      margin: 0 0 10px;
      color: #687276;
      font-size: 12px;
      line-height: 18px;
      font-weight: 650;
    }

    .setting-row {
      display: grid;
      min-height: 48px;
      grid-template-columns: minmax(180px, 1fr) auto;
      align-items: center;
      column-gap: 28px;
    }

    .setting-label {
      font-size: 14px;
      line-height: 20px;
    }

    .control-line {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    input[type="range"] {
      width: 190px;
      accent-color: #217f7b;
    }

    #scale-value,
    #bubble-scale-value {
      width: 44px;
      color: #5e696d;
      font-size: 13px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .switch {
      position: relative;
      width: 38px;
      height: 22px;
      flex: 0 0 38px;
    }

    .switch input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .switch-track {
      position: absolute;
      inset: 0;
      border: 1px solid #bdc5c8;
      border-radius: 11px;
      background: #cbd1d3;
      cursor: pointer;
      transition: background 150ms ease, border-color 150ms ease;
    }

    .switch-track::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(22, 31, 33, 0.25);
      transition: transform 150ms ease;
    }

    .switch input:checked + .switch-track {
      border-color: #217f7b;
      background: #217f7b;
    }

    .switch input:checked + .switch-track::after { transform: translateX(16px); }
    .switch input:focus-visible + .switch-track { outline: 2px solid #88c8c4; outline-offset: 2px; }

    .segments {
      display: inline-flex;
      padding: 2px;
      border: 1px solid #cfd5d7;
      border-radius: 7px;
      background: #e8ebed;
    }

    .segment {
      min-width: 58px;
      height: 27px;
      padding: 0 12px;
      border: 0;
      border-radius: 5px;
      color: #596468;
      background: transparent;
      font-size: 12px;
      cursor: pointer;
    }

    .segment.active {
      color: #243033;
      background: #fff;
      box-shadow: 0 1px 3px rgba(28, 39, 41, 0.16);
    }

    #activity-mode {
      position: relative;
    }

    #activity-mode::before {
      content: "";
      position: absolute;
      z-index: 0;
      top: 2px;
      bottom: 2px;
      left: 2px;
      width: calc((100% - 4px) / 3);
      border-radius: 5px;
      background: #fff;
      box-shadow: 0 1px 3px rgba(28, 39, 41, 0.16);
      transition: transform 180ms ease;
    }

    #activity-mode[data-value="daily"]::before { transform: translateX(100%); }
    #activity-mode[data-value="office"]::before { transform: translateX(200%); }
    #activity-mode .segment { position: relative; z-index: 1; }
    #activity-mode .segment.active { background: transparent; box-shadow: none; }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 44px;
    }

    .button-group { display: flex; gap: 8px; }

    .button {
      min-height: 32px;
      padding: 0 13px;
      border: 1px solid #cbd1d3;
      border-radius: 6px;
      color: #2c373a;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
    }

    .button:hover { border-color: #aab4b7; background: #fafbfb; }
    .button:active { background: #eef1f2; }
    .button.danger { color: #a33c3c; }

    #status {
      min-width: 56px;
      color: #217f7b;
      font-size: 12px;
      opacity: 0;
      transition: opacity 160ms ease;
    }

    #status.visible { opacity: 1; }

    .setting-copy {
      display: grid;
      gap: 2px;
    }

    .setting-note {
      color: #7a8488;
      font-size: 11px;
      line-height: 16px;
    }

    #lyrics-status[data-state="active"] { color: #217f7b; }
    #lyrics-status[data-state="error"],
    #lyrics-status[data-state="permission"] { color: #a65a3f; }

    .secret-input {
      width: 250px;
      height: 32px;
      padding: 0 9px;
      border: 1px solid #cbd1d3;
      border-radius: 5px;
      outline: 0;
      color: #263033;
      background: #fff;
      font-size: 13px;
    }

    .secret-input:focus { border-color: #5ca9a4; box-shadow: 0 0 0 2px rgba(70, 151, 145, 0.14); }
    .secret-input::placeholder { color: #9aa3a6; }

    #ai-status[data-state="ready"] { color: #217f7b; }
    #ai-status[data-state="error"] { color: #a65a3f; }

    .inline-buttons { display: flex; justify-content: flex-end; gap: 7px; }

    #update-status[data-state="latest"] { color: #217f7b; }
    #update-status[data-state="available"],
    #update-status[data-state="downloading"],
    #update-status[data-state="downloaded"] { color: #a05f2e; }
    #update-status[data-state="error"],
    #update-status[data-state="unconfigured"] { color: #a65a3f; }
    #update-notes {
      margin: 4px 0 0;
      color: #7a8488;
      font-size: 11px;
      line-height: 16px;
      white-space: pre-line;
    }
    #update-progress {
      width: 100%;
      height: 6px;
      accent-color: #217f7b;
    }
    .repo-input { width: 230px; }
  </style>
</head>
<body>
  <header>
    <img class="avatar" id="character-avatar" alt="桌宠角色">
    <div>
      <h1 id="product-name">桌宠</h1>
      <p class="subtitle">偏好设置</p>
    </div>
  </header>

  <main>
    <section id="section-display">
      <h2>显示</h2>
      <div class="setting-row">
        <span class="setting-label">桌宠大小</span>
        <div class="control-line">
          <input id="scale" type="range" min="45" max="140" step="5" aria-label="桌宠大小">
          <span id="scale-value">100%</span>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">总在最前</span>
        <label class="switch">
          <input id="always-on-top" type="checkbox">
          <span class="switch-track"></span>
        </label>
      </div>
      <div class="setting-row">
        <div class="setting-copy">
          <span class="setting-label">鼠标穿透</span>
          <span class="setting-note">开启后桌宠不再拦截鼠标，点击会穿透到背后的窗口；可通过托盘菜单「鼠标穿透」关闭</span>
        </div>
        <label class="switch">
          <input id="mouse-through" type="checkbox">
          <span class="switch-track"></span>
        </label>
      </div>
      <div class="setting-row">
        <span class="setting-label">文字气泡大小</span>
        <div class="control-line">
          <input id="bubble-scale" type="range" min="65" max="125" step="5" aria-label="文字气泡大小">
          <span id="bubble-scale-value">100%</span>
        </div>
      </div>
    </section>

    <section id="section-companion">
      <h2>陪伴</h2>
      <div class="setting-row">
        <span class="setting-label">桌宠模式</span>
        <div class="segments" id="activity-mode" role="group" aria-label="桌宠模式">
          <button class="segment" type="button" data-value="quiet">安静</button>
          <button class="segment" type="button" data-value="daily">日常</button>
          <button class="segment" type="button" data-value="office">办公</button>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">自动活动</span>
        <label class="switch">
          <input id="auto-action" type="checkbox">
          <span class="switch-track"></span>
        </label>
      </div>
      <div class="setting-row">
        <span class="setting-label">活动频率</span>
        <div class="segments" id="frequency" role="group" aria-label="活动频率">
          <button class="segment" type="button" data-value="rare">偶尔</button>
          <button class="segment" type="button" data-value="normal">适中</button>
          <button class="segment" type="button" data-value="frequent">常常</button>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">简短文字</span>
        <label class="switch">
          <input id="speech" type="checkbox">
          <span class="switch-track"></span>
        </label>
      </div>
      <div class="setting-row" id="lyrics-setting">
        <div class="setting-copy">
          <span class="setting-label">QQ 音乐同步歌词</span>
          <span class="setting-note" id="lyrics-status" data-state="disabled">未开启</span>
        </div>
        <label class="switch">
          <input id="qq-lyrics" type="checkbox">
          <span class="switch-track"></span>
        </label>
      </div>
    </section>

    <section id="section-system">
      <h2>系统</h2>
      <div class="setting-row">
        <span class="setting-label">登录时启动</span>
        <label class="switch">
          <input id="login" type="checkbox">
          <span class="switch-track"></span>
        </label>
      </div>
    </section>

    <section id="section-update">
      <h2>更新</h2>
      <div class="setting-row">
        <div class="setting-copy">
          <span class="setting-label">GitHub 仓库</span>
          <span class="setting-note">从该仓库的 Releases 获取新版本（格式：owner/repo，回车保存）</span>
        </div>
        <input class="secret-input repo-input" id="update-repo" type="text" placeholder="用户名/仓库名" spellcheck="false">
      </div>
      <div class="setting-row">
        <div class="setting-copy">
          <span class="setting-label">自动检查更新</span>
          <span class="setting-note">启动后自动检查，发现新版本时弹出通知</span>
        </div>
        <label class="switch">
          <input id="auto-update" type="checkbox">
          <span class="switch-track"></span>
        </label>
      </div>
      <div class="setting-row">
        <div class="setting-copy">
          <span class="setting-label">当前版本</span>
          <span class="setting-note" id="update-current-version">—</span>
          <span class="setting-note" id="update-status" data-state="idle">未检查</span>
        </div>
        <div class="control-line">
          <button class="button" id="update-check" type="button">检查更新</button>
          <button class="button" id="update-install" type="button" hidden>立即更新</button>
        </div>
      </div>
      <div class="setting-row" id="update-progress-row" hidden>
        <div class="setting-copy">
          <span class="setting-label">下载进度</span>
          <progress id="update-progress" max="100" value="0"></progress>
        </div>
      </div>
      <p class="setting-note" id="update-notes" hidden></p>
    </section>

    <section class="actions">
      <div class="button-group">
        <button class="button" id="manage-actions" type="button">动作管理</button>
        <button class="button" id="reset-position" type="button">重置位置</button>
        <button class="button" id="hide-pet" type="button">隐藏桌宠</button>
      </div>
      <div class="control-line">
        <span id="status">已保存</span>
        <button class="button danger" id="quit" type="button">退出应用</button>
      </div>
    </section>
  </main>

  <script>
    const controls = {
      scale: document.getElementById('scale'),
      bubbleScale: document.getElementById('bubble-scale'),
      alwaysOnTop: document.getElementById('always-on-top'),
      autoActionEnabled: document.getElementById('auto-action'),
      speechEnabled: document.getElementById('speech'),
      qqLyricsEnabled: document.getElementById('qq-lyrics'),
      openAtLogin: document.getElementById('login'),
      mouseThrough: document.getElementById('mouse-through'),
      autoUpdateEnabled: document.getElementById('auto-update')
    };
    const scaleValue = document.getElementById('scale-value');
    const bubbleScaleValue = document.getElementById('bubble-scale-value');
    const frequencyButtons = [...document.querySelectorAll('#frequency .segment')];
    const activityModeControl = document.getElementById('activity-mode');
    const activityModeButtons = [...document.querySelectorAll('#activity-mode .segment')];
    const status = document.getElementById('status');
    const lyricsStatus = document.getElementById('lyrics-status');
    const lyricsSetting = document.getElementById('lyrics-setting');
    const repoInput = document.getElementById('update-repo');
    const currentVersionEl = document.getElementById('update-current-version');
    const updateStatusEl = document.getElementById('update-status');
    const updateCheckButton = document.getElementById('update-check');
    const updateInstallButton = document.getElementById('update-install');
    const updateNotesEl = document.getElementById('update-notes');
    const updateProgressRow = document.getElementById('update-progress-row');
    const updateProgressEl = document.getElementById('update-progress');
    let config = null;
    let saveTimer = null;
    let statusTimer = null;

    function render(nextConfig) {
      config = nextConfig;
      controls.scale.value = Math.round(config.scale * 100);
      scaleValue.textContent = `${controls.scale.value}%`;
      controls.bubbleScale.value = Math.round(config.bubbleScale * 100);
      bubbleScaleValue.textContent = `${controls.bubbleScale.value}%`;
      controls.alwaysOnTop.checked = config.alwaysOnTop;
      controls.autoActionEnabled.checked = config.autoActionEnabled;
      controls.speechEnabled.checked = config.speechEnabled;
      controls.qqLyricsEnabled.checked = config.qqLyricsEnabled;
      controls.openAtLogin.checked = config.openAtLogin;
      controls.mouseThrough.checked = config.mouseThrough;
      controls.autoUpdateEnabled.checked = config.autoUpdateEnabled;
      repoInput.value = [config.updateOwner, config.updateRepo].filter(Boolean).join('/');
      activityModeControl.dataset.value = config.activityMode;
      activityModeButtons.forEach((button) => {
        button.classList.toggle('active', button.dataset.value === config.activityMode);
      });
      frequencyButtons.forEach((button) => {
        button.classList.toggle('active', button.dataset.value === config.actionFrequency);
        button.disabled = !config.autoActionEnabled;
      });
    }

    function showSaved() {
      window.clearTimeout(statusTimer);
      status.classList.add('visible');
      statusTimer = window.setTimeout(() => status.classList.remove('visible'), 1200);
    }

    function renderUpdateState(state) {
      state = state || {};
      const phase = state.phase || 'idle';
      currentVersionEl.textContent = state.currentVersion ? `v${state.currentVersion}` : '—';
      let text = '';
      if (phase === 'checking') text = '正在检查更新…';
      else if (phase === 'latest') text = `已是最新版本 v${state.latestVersion || state.currentVersion}`;
      else if (phase === 'available') text = state.latestVersion ? `发现新版本 v${state.latestVersion}` : '发现新版本';
      else if (phase === 'no-asset') text = state.message || '该版本没有可用的安装包';
      else if (phase === 'downloading') text = `正在下载…${state.percent != null ? ' ' + Math.round(state.percent) + '%' : ''}`;
      else if (phase === 'downloaded') text = '下载完成，正在启动安装…';
      else if (phase === 'error') text = state.message || '检查更新失败';
      else if (phase === 'unconfigured') text = '尚未配置 GitHub 仓库';
      else if (!(state.repoOwner && state.repoName)) text = '尚未配置 GitHub 仓库';
      else text = '未检查';
      updateStatusEl.textContent = text;
      if (['latest'].includes(phase)) updateStatusEl.dataset.state = 'latest';
      else if (['error', 'no-asset', 'unconfigured'].includes(phase)) updateStatusEl.dataset.state = 'error';
      else if (['available', 'downloading', 'downloaded'].includes(phase)) updateStatusEl.dataset.state = 'available';
      else updateStatusEl.dataset.state = 'idle';

      const busy = ['checking', 'downloading', 'downloaded'].includes(phase);
      updateCheckButton.disabled = busy || !(state.repoOwner && state.repoName);
      updateCheckButton.textContent = phase === 'checking' ? '检查中…' : '检查更新';
      const installable = ['available', 'downloading', 'downloaded'].includes(phase);
      updateInstallButton.hidden = !installable;
      updateInstallButton.disabled = phase !== 'available';
      if (phase === 'available' && state.latestVersion) updateInstallButton.textContent = `立即更新 v${state.latestVersion}`;
      else if (phase === 'downloading') updateInstallButton.textContent = '下载中…';
      else if (phase === 'downloaded') updateInstallButton.textContent = '正在安装…';
      updateProgressRow.hidden = phase !== 'downloading';
      if (state.percent != null) updateProgressEl.value = Math.min(100, Math.max(0, Number(state.percent) || 0));

      const notes = (phase === 'available' && state.releaseNotes)
        ? `v${state.latestVersion} 更新说明：\n${state.releaseNotes}`
        : ((phase === 'no-asset' || phase === 'error') && state.message ? state.message : '');
      updateNotesEl.hidden = !notes;
      updateNotesEl.textContent = notes;
    }

    async function refreshUpdateState() {
      try {
        renderUpdateState(await window.companionAPI.getUpdateState());
      } catch (_error) {}
    }

    function commitRepo() {
      const match = repoInput.value.trim().match(/^([A-Za-z0-9_.-]+)\/([A-Za-z0-9_.-]+)$/);
      if (!match) {
        updateStatusEl.dataset.state = 'error';
        updateStatusEl.textContent = '仓库格式应为 owner/repo，例如：username/repo';
        repoInput.focus();
        return;
      }
      save({ updateOwner: match[1], updateRepo: match[2] });
    }

    function renderLyricsStatus(nextStatus) {
      lyricsStatus.textContent = nextStatus?.message || '未开启';
      lyricsStatus.dataset.state = nextStatus?.state || 'disabled';
    }

    async function save(partial) {
      render(await window.companionAPI.saveConfig(partial));
      refreshUpdateState();
      showSaved();
    }

    controls.scale.addEventListener('input', () => {
      scaleValue.textContent = `${controls.scale.value}%`;
      window.clearTimeout(saveTimer);
      saveTimer = window.setTimeout(() => save({ scale: Number(controls.scale.value) / 100 }), 80);
    });

    controls.bubbleScale.addEventListener('input', () => {
      bubbleScaleValue.textContent = `${controls.bubbleScale.value}%`;
      window.clearTimeout(saveTimer);
      saveTimer = window.setTimeout(() => save({ bubbleScale: Number(controls.bubbleScale.value) / 100 }), 80);
    });

    for (const [key, input] of Object.entries(controls)) {
      if (key === 'scale' || key === 'bubbleScale') continue;
      input.addEventListener('change', () => save({ [key]: input.checked }));
    }

    frequencyButtons.forEach((button) => {
      button.addEventListener('click', () => save({ actionFrequency: button.dataset.value }));
    });

    activityModeButtons.forEach((button) => {
      button.addEventListener('click', () => save({ activityMode: button.dataset.value }));
    });

    document.getElementById('reset-position').addEventListener('click', async () => {
      await window.companionAPI.resetPosition();
      showSaved();
    });
    document.getElementById('manage-actions').addEventListener('click', () => window.companionAPI.openActionManager());
    document.getElementById('hide-pet').addEventListener('click', () => window.companionAPI.hidePet());
    document.getElementById('quit').addEventListener('click', () => window.companionAPI.quit());
    repoInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') repoInput.blur();
    });
    repoInput.addEventListener('change', commitRepo);
    updateCheckButton.addEventListener('click', async () => {
      updateStatusEl.dataset.state = 'idle';
      updateStatusEl.textContent = '正在检查更新…';
      updateCheckButton.disabled = true;
      try {
        renderUpdateState(await window.companionAPI.checkForUpdates());
      } catch (_error) {
        updateStatusEl.dataset.state = 'error';
        updateStatusEl.textContent = '检查更新失败';
        updateCheckButton.disabled = false;
      }
    });
    updateInstallButton.addEventListener('click', () => window.companionAPI.installUpdate());
    window.companionAPI.onConfigChanged(render);
    window.companionAPI.onLyricsStatusChanged(renderLyricsStatus);
    window.companionAPI.onSettingsNavigate((section) => {
      const target = document.getElementById(`section-${section}`);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    window.companionAPI.onUpdateState(renderUpdateState);
    window.companionAPI.getCharacter().then((character) => {
      document.title = `${character.productName}设置`;
      document.getElementById('product-name').textContent = character.productName;
      const avatar = document.getElementById('character-avatar');
      avatar.alt = character.name;
      if (character.idleMediaUrl) avatar.src = character.idleMediaUrl;
      const lyricsAvailable = window.companionAPI.platform === 'darwin' && character.features?.qqLyrics;
      lyricsSetting.hidden = !lyricsAvailable;
      controls.qqLyricsEnabled.disabled = !lyricsAvailable;
    });
    window.companionAPI.getConfig().then(render);
    window.companionAPI.getLyricsStatus().then(renderLyricsStatus);
    window.companionAPI.getUpdateState().then(renderUpdateState);
  </script>
</body>
</html>
