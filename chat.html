<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>AI 聊天</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #253034;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; background: #f6f7f8; }
    body { display: flex; flex-direction: column; overflow: hidden; }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 54px;
      padding: 0 14px;
      border-bottom: 1px solid #dfe3e6;
      background: #fff;
    }
    header .title { font-size: 14px; font-weight: 650; white-space: nowrap; }
    header select {
      flex: 1;
      min-width: 0;
      height: 30px;
      padding: 0 8px;
      border: 1px solid #cbd1d3;
      border-radius: 6px;
      color: #263033;
      background: #fff;
      font: inherit;
      font-size: 12px;
      outline: 0;
    }
    .ghost-button {
      height: 30px;
      padding: 0 11px;
      border: 1px solid #cbd1d3;
      border-radius: 6px;
      color: #2c373a;
      background: #fff;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .ghost-button:hover { border-color: #aab4b7; background: #fafbfb; }
    .ghost-button:disabled { opacity: 0.5; cursor: default; }

    #banner {
      padding: 8px 14px;
      color: #7a5b34;
      background: #fdf3e3;
      border-bottom: 1px solid #ecd9b8;
      font-size: 12px;
      line-height: 18px;
    }
    #banner button {
      margin-left: 6px;
      border: 0;
      color: #217f7b;
      background: transparent;
      font-size: 12px;
      cursor: pointer;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      display: flex;
    }
    .msg.user { justify-content: flex-end; }
    .msg.assistant { justify-content: flex-start; }
    .msg.system { justify-content: center; }
    .bubble {
      max-width: 82%;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 13.5px;
      line-height: 20px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble {
      color: #fff;
      background: #217f7b;
      border-bottom-right-radius: 3px;
    }
    .msg.assistant .bubble {
      color: #263033;
      background: #fff;
      border: 1px solid #e3e7e9;
      border-bottom-left-radius: 3px;
    }
    .msg.system .bubble {
      max-width: 96%;
      color: #8a9498;
      background: transparent;
      font-size: 11.5px;
      line-height: 16px;
      text-align: center;
    }
    .caret::after {
      content: "▍";
      color: #217f7b;
      animation: blink 900ms steps(2) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .msg .persona-tag {
      display: block;
      margin-bottom: 3px;
      color: #9aa3a6;
      font-size: 11px;
    }
    .msg.user .persona-tag { display: none; }

    footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid #dfe3e6;
      background: #fff;
    }
    #input {
      flex: 1;
      min-width: 0;
      height: 38px;
      padding: 0 12px;
      border: 1px solid #cbd1d3;
      border-radius: 8px;
      outline: 0;
      color: #263033;
      background: #fbfcfc;
      font: inherit;
      font-size: 13.5px;
    }
    #input:focus { border-color: #5ca9a4; box-shadow: 0 0 0 2px rgba(70, 151, 145, 0.14); }
    #send {
      min-width: 62px;
      height: 38px;
      padding: 0 16px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: #217f7b;
      font-size: 13.5px;
      cursor: pointer;
    }
    #send:disabled { opacity: 0.55; cursor: default; }
    #stop {
      height: 38px;
      padding: 0 12px;
      border: 1px solid #d3a8a0;
      border-radius: 8px;
      color: #a33c3c;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <span class="title">凯尔希 AI 聊天</span>
    <select id="persona-select" aria-label="切换人格"></select>
    <button class="ghost-button" id="new-session" type="button">新对话</button>
  </header>
  <div id="banner" hidden>
    AI 聊天尚未开启或未配置接口，请先完成设置。
    <button id="go-settings" type="button">去设置</button>
  </div>
  <main id="messages" aria-live="polite"></main>
  <footer>
    <input id="input" type="text" placeholder="对凯尔希说点什么…（Enter 发送）" autocomplete="off" maxlength="2000">
    <button id="stop" type="button" hidden>停止</button>
    <button id="send" type="button" disabled>发送</button>
  </footer>
  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendButton = document.getElementById('send');
    const stopButton = document.getElementById('stop');
    const bannerEl = document.getElementById('banner');
    const personaSelect = document.getElementById('persona-select');
    let state = null;
    let localMessages = [];
    let streaming = false;
    let streamBubbleEl = null;
    let personaName = '';

    function addSystemNotice(text) {
      localMessages.push({ role: 'system', content: text });
      appendMessage('system', text, '');
      scrollBottom();
    }

    function scrollBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function appendMessage(role, text, tag) {
      const wrap = document.createElement('div');
      wrap.className = 'msg ' + role;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      if (tag) {
        const tagEl = document.createElement('span');
        tagEl.className = 'persona-tag';
        tagEl.textContent = tag;
        bubble.appendChild(tagEl);
      }
      const contentEl = document.createElement('span');
      contentEl.textContent = text;
      bubble.appendChild(contentEl);
      wrap.appendChild(bubble);
      messagesEl.appendChild(wrap);
      return contentEl;
    }

    function renderMessages() {
      messagesEl.textContent = '';
      for (const message of localMessages) {
        appendMessage(message.role, message.content, message.role === 'assistant' ? personaName : '');
      }
      scrollBottom();
    }

    function renderPersonaSelect() {
      const personas = state && state.personas ? state.personas : [];
      personaSelect.textContent = '';
      for (const persona of personas) {
        const option = document.createElement('option');
        option.value = persona.id;
        option.textContent = persona.name + (persona.id === 'kaltsit' ? '（默认）' : '');
        option.selected = persona.id === state.activePersonaId;
        personaSelect.appendChild(option);
      }
      const active = personas.find((p) => p.id === state.activePersonaId) || personas[0];
      personaName = active ? active.name : 'AI';
      document.querySelector('.title').textContent = personaName + ' · AI 聊天';
      window.document.title = personaName + ' · AI 聊天';
    }

    function refreshBanner() {
      const ready = state && state.enabled && state.baseConfigured && state.keyConfigured;
      bannerEl.hidden = Boolean(ready);
      sendButton.disabled = Boolean(!ready) || streaming;
    }

    function applyState(nextState) {
      state = nextState;
      streaming = Boolean(state && state.busy);
      renderPersonaSelect();
      refreshBanner();
      sendButton.disabled = Boolean(!state || !state.enabled || !state.baseConfigured || !state.keyConfigured) || streaming;
      stopButton.hidden = !streaming;
      if (!streaming && streamBubbleEl) {
        streamBubbleEl.classList.remove('caret');
        streamBubbleEl = null;
      }
      if (streaming && !streamBubbleEl) {
        localMessages.push({ role: 'assistant', content: '' });
        const holder = appendMessage('assistant', '', personaName);
        holder.classList.add('caret');
        streamBubbleEl = holder;
        scrollBottom();
      }
    }

    async function send() {
      const text = inputEl.value.trim();
      if (!text || streaming || !state || !state.enabled) return;
      inputEl.value = '';
      localMessages.push({ role: 'user', content: text });
      appendMessage('user', text, '');
      streaming = true;
      localMessages.push({ role: 'assistant', content: '' });
      const holder = appendMessage('assistant', '', personaName);
      holder.classList.add('caret');
      streamBubbleEl = holder;
      sendButton.disabled = true;
      stopButton.hidden = false;
      scrollBottom();
      await window.companionAPI.aiSend(text);
    }

    window.companionAPI.onAiDelta((payload) => {
      if (!streamBubbleEl) return;
      const piece = (payload && payload.delta) || '';
      const span = streamBubbleEl;
      span.textContent += piece;
      scrollBottom();
    });
    window.companionAPI.onAiDone((payload) => {
      if (streamBubbleEl) streamBubbleEl.classList.remove('caret');
      streamBubbleEl = null;
      streaming = false;
      sendButton.disabled = false;
      stopButton.hidden = true;
      const last = localMessages[localMessages.length - 1];
      if (last && last.role === 'assistant') last.content = (payload && payload.reply) || '';
      scrollBottom();
    });
    window.companionAPI.onAiError((payload) => {
      const message = (payload && payload.message) || '出错了';
      if (streamBubbleEl) {
        const partial = streamBubbleEl.textContent;
        if (partial) {
          const last = localMessages[localMessages.length - 1];
          if (last && last.role === 'assistant') last.content = partial;
        } else {
          localMessages.pop();
          messagesEl.lastChild && messagesEl.lastChild.remove();
        }
        streamBubbleEl.classList.remove('caret');
        streamBubbleEl = null;
      }
      streaming = false;
      sendButton.disabled = false;
      stopButton.hidden = true;
      addSystemNotice('⚠ ' + message);
      scrollBottom();
    });
    window.companionAPI.onAiState(applyState);

    sendButton.addEventListener('click', send);
    inputEl.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        send();
      }
    });
    stopButton.addEventListener('click', () => window.companionAPI.aiStop());
    document.getElementById('new-session').addEventListener('click', async () => {
      await window.companionAPI.aiNewSession();
      localMessages = [];
      renderMessages();
      addSystemNotice('已开始新的对话。');
    });
    personaSelect.addEventListener('change', async () => {
      const id = personaSelect.value;
      if (!id || id === (state && state.activePersonaId)) return;
      await window.companionAPI.aiActivatePersona(id);
      localMessages = [];
      renderMessages();
      const next = await window.companionAPI.aiGetState();
      applyState(next);
      addSystemNotice('已切换人格：' + personaName + '，开始新的对话。');
    });
    document.getElementById('go-settings').addEventListener('click', () => window.companionAPI.openSettings('ai'));

    window.companionAPI.aiGetState().then((nextState) => {
      applyState(nextState);
      if (nextState && nextState.persona && nextState.persona.name) {
        addSystemNotice('正在与「' + nextState.persona.name + '」对话，随时可以和我聊聊～');
      } else {
        addSystemNotice('你好，我是凯尔希。');
      }
    });
  </script>
</body>
</html>
