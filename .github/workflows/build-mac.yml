name: build-mac

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '上传到的 Release tag'
        required: false
        default: 'v0.2.1'
      arch:
        description: 'macOS 架构'
        required: false
        default: 'arm64'
        type: choice
        options:
          - 'arm64'
          - 'x64'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  mac-build:
    name: macOS build (${{ inputs.arch || 'arm64' }})
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build mac (electron-builder)
        run: npx electron-builder --mac --${{ inputs.arch || 'arm64' }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ inputs.arch || 'arm64' }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        run: |
          TAG="${TAG_INPUT}";
          if [ -z "$TAG" ]; then TAG="v0.2.1"; fi
          if git ls-remote --tags origin "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.dmg dist/*.zip --clobber
            echo "uploaded to ${TAG}"
          else
            echo "tag ${TAG} not found, artifacts kept in Actions only"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_INPUT: ${{ inputs.release_tag }}
