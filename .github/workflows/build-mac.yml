name: build-mac

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '把产物上传到的 Release tag'
        required: false
        default: 'v0.2.1'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  mac-build:
    name: macOS build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            arch: x64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build mac (electron-builder)
        run: npx electron-builder --mac --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        run: |
          TAG="${{ inputs.release_tag }}";
          if [ -z "$TAG" ]; then TAG="v0.2.1"; fi
          if git ls-remote --tags origin "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.dmg dist/*.zip --clobber
            echo "uploaded to ${TAG}"
          else
            echo "tag ${TAG} not found, artifacts kept in Actions only"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
